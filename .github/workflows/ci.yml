name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (synthetic only)
        run: pnpm test
      - name: Certification report (generate — records, does not gate)
        run: pnpm certify:generate
      - name: Certification report lockstep (regenerated artifact must match the committed one)
        run: |
          git diff --exit-code -- docs/certification/ || {
            echo "::error::Certification report out of lockstep with the tree — regenerate and commit (pnpm certify:generate)."
            git diff -- docs/certification/
            exit 1
          }
      - name: Certification report verification (integrity gate)
        run: pnpm certify:verify
      - name: Secret scan (non-blocking informational)
        run: |
          echo "Scanning for obvious secret patterns in tracked files..."
          ! git grep -nE "(sk-[A-Za-z0-9]{8,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,})" HEAD -- . || { echo "::error::Potential secret pattern found"; exit 1; }
