        '409':
          description: |
            Two families: terminal-state conflict (`ACTIVATION_REVOKED` —
            deactivating a REVOKED activation; body WITHOUT `requestId`) and
            nonce replay (body WITH `requestId` and replay context).
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
