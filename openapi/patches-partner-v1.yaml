  /api/partner/v1/activations/{activationId}/revoke:
    post:
      operationId: revokeActivation
      tags: [Activations]
      summary: Revoke an activation (terminal, idempotent by status).
      description: |
        Revoke. A JSON object body is REQUIRED (an empty or non-JSON body is
        400 `MALFORMED_PAYLOAD`) but its content is ignored — the activation
        is identified by the path parameter.

        Lifecycle: revoking an ACTIVE or DEACTIVATED activation persists
        `REVOKED` (event `activation.revoked`); revoking an already-REVOKED
