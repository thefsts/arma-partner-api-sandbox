        '404':
          description: 'Unknown activation — `ACTIVATION_UNKNOWN` (POST route: body WITHOUT `requestId`).'
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
