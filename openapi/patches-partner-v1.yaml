              schema:
                $ref: '#/components/schemas/StateChangeReceipt'
              examples:
                deactivated:
                  $ref: '#/components/examples/ReceiptDeactivate'
        '400':
          description: |
            Body is not a JSON object — `MALFORMED_PAYLOAD` (a JSON object
            body is required even though its content is ignored). A defensive
            `INVALID_BODY` (`{ error, errorClass: 'INPUT', requestId }`)
            covers unexpected body-read failures.
          headers:
            x-request-id:
