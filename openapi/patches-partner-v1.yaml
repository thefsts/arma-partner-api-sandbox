# PATCHES Partner API v1 — OpenAPI 3.1 contract
#
# Grounded 100% in the reference implementation at repo baseline 465a3ae:
#   patches/lib/server.ts                     (HTTP handler, routes, pipelines)
#   patches/lib/security.ts                   (scoped partner auth + HMAC + replay)
#   patches/lib/policy.ts                     (org -> entitlement -> capability -> binding)
#   patches/lib/receipts.ts                   (raw-byte receipt signing/verification)
#   patches/lib/rateLimit.ts                  (per-clientId token bucket)
#   patches/lib/store.ts                      (record shapes, transactional writes)
#   patches/patches/partner-v1-health-route.ts (platform-mounted live health route)
# Exercised end-to-end over real HTTP by the patches test matrix
# (partner.api 27-scenario matrix + partner.client adapter lane) in CI.
#
# Nothing here is invented: every operation, header, field, status code, and
# error code exists in the sources above. Internal-only material (synthetic
# test secrets, fail-point injection, private deployment details, the ops-level
# credential-rotation library functions) is intentionally excluded.
openapi: 3.1.0
info:
  title: PATCHES Partner API
  version: 1.0.0
  summary: Partner-facing activation lifecycle API — scoped HMAC authentication, tenant-scoped discovery, idempotent activations with raw-byte signed receipts, events, and scrubbed audit.
  description: |
    Wire contract for the PATCHES Partner API v1 (receipt protocol schema
    `patches-partner-v1`).

    Scope — exactly the implemented v1 surface (all routes under
    `/api/partner/v1`):
      * `GET  /health`                                — live readiness (unauthenticated)
      * `GET  /capabilities`                          — capability discovery
      * `GET  /entitlements?orgId=...`                — tenant-scoped entitlement lookup
      * `POST /activations`                           — idempotent activation create
      * `GET  /activations/{activationId}`            — activation status
      * `POST /activations/{activationId}/deactivate` — deactivate (idempotent by status)
      * `POST /activations/{activationId}/revoke`     — revoke (terminal)
      * `GET  /events?orgId=...`                      — activation events
      * `GET  /audit?orgId=...`                       — scrubbed audit trail (own orgs only)

    Versioning: only `v1` is supported. A request to any other version segment
    (e.g. `/api/partner/v2/...`) fails closed with 400
    `{ error: 'UNSUPPORTED_API_VERSION', errorClass: 'VERSION', supported: ['v1'], requestId }`.

    Authentication (cumulative — never a substitute for tenant scoping):
    HMAC-SHA256 request signing per the `PatchesSignedRequest` scheme. Signature
    verification is the first gate only; every operation additionally enforces
    organization ownership, entitlement license windows, capability
    registration, and device/subject binding. Rate limiting (token bucket,
    capacity 30, refill 10 per second, per clientId) applies AFTER
    authentication so anonymous floods cannot consume partner quota.

    Request integrity:
      * timestamps must be within 300000 ms (±5 minutes) of server time
      * nonces match `[A-Za-z0-9_-]{20,128}`, are single-use, and have a
        600000 ms (10 minutes) validity window; a fully processed request
        registers its nonce in the SAME transaction as the operation outcome
      * request bodies are limited to 262144 bytes (256 KiB); every POST route
        requires a JSON object body (deactivate/revoke bodies are
        present-but-ignored — the activation is identified by the path)

    Error shapes — two families (all JSON, all structured, no raw messages):
      * handler-level errors (authentication, rate limit, malformed or
        oversized body, unsupported version, unmatched route) carry `requestId`
        in the body
      * business-pipeline errors on POST routes (policy denials, idempotency
        conflict, state conflict, unknown activation, downstream, persistence)
        carry `{ error, errorClass }` WITHOUT `requestId` in the body — the
        `x-request-id` response header always carries it
      * `ACTIVATION_INPUT_MISSING` uniquely carries `{ error, fields }`
        (no `errorClass`)
      * the kill-switch 503 `PARTNER_API_DISABLED` is a single-key body

    There is no 405 in this API: a method that does not match the route falls
    through to 404 `NOT_FOUND` (with `requestId`).

    Idempotency (`POST /activations`, keyed by clientId + idempotencyKey):
      * same request hash → 200 duplicate receipt (`duplicate: true`, receiptId
        `RCP-DUP-<requestId>`) that echoes the ORIGINAL activation
      * different request hash → 409 `IDEMPOTENCY_KEY_CONFLICT`
      * the request hash is sha256 over the serialized request object, so any
        semantic difference — including extra fields — is a conflict, never a
        silent duplicate
      * deactivate/revoke are idempotent by STATUS (second call is a no-op
        success receipt); REVOKED is terminal — deactivating a REVOKED
        activation is 409 `ACTIVATION_REVOKED`

    Receipts: every 200 on a POST route is a receipt signed over its EXACT raw
    response bytes — verify the bytes you received, never a re-serialization:
      * `x-patches-receipt-id`, `x-patches-content-sha256` (sha256 of the raw
        response bytes), `x-patches-signature` (hex HMAC-SHA256 over the raw
        bytes with the receipt secret)
      * verification fails closed with reasons `RECEIPT_MISSING_HEADERS`,
        `RECEIPT_INVALID_SIGNATURE`, `RECEIPT_CONTENT_HASH_MISMATCH`,
        `RECEIPT_BODY_MALFORMED`, `RECEIPT_FIELD_MISMATCH`
      * GET routes never produce receipt headers; error bodies are never
        receipts

    Every response carries `x-request-id` (echoing the caller's `x-request-id`
    header when present, else `req-<uuid>`), `x-api-version: v1`, and
    `cache-control: no-store` — except the kill-switch 503s, which are emitted
    before request-id assignment and carry only the baseline headers.

    Fail-closed guarantees:
      * downstream protection failure (503 `DOWNSTREAM_UNAVAILABLE`) persists
        NOTHING — no partial activation, no receipt, no event
      * persistence failure (500 `PARTNER_PERSISTENCE_FAILED`) leaves no
        partial state (single transaction) and does NOT register the nonce
      * kill switch (`PATCHES_PARTNER_API_DISABLED=true`) blocks every route
        except health, which reports the disabled state live (503, never
        cached)
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: '{protocol}://{partnerApiHost}'
    description: PATCHES Partner API (partner-facing; all routes under /api/partner/v1)
    variables:
      protocol:
        default: https
        enum: [https, http]
      partnerApiHost:
        default: partner.api.example.invalid

tags:
  - name: Health
    description: Live readiness — unauthenticated, never cached, reflects the kill switch.
  - name: Discovery
    description: Capability and entitlement discovery — authenticated, tenant-scoped.
  - name: Activations
    description: Activation lifecycle — idempotent create, status, deactivate, revoke (raw-byte signed receipts on state changes).
  - name: Events and Audit
    description: Tenant-scoped activation events and scrubbed audit trail.

security:
  - PatchesSignedRequest: []

paths:
  /api/partner/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Live readiness probe (unauthenticated).
      description: |
        Live health — computed fresh on every request, never cached (a cached
        health probe would lie about the kill switch).

        When `PATCHES_PARTNER_API_DISABLED=true` this route reports the disabled
        state itself (503 with `status: 'disabled'`) while every other route
        fails closed with the single-key 503 `PARTNER_API_DISABLED`. The 503
        disabled body omits `capabilities`/`supportedApiVersions` and is
        emitted before request-id assignment, so it carries no `x-request-id`
        header. Any non-GET method on this path falls through to 404
        `NOT_FOUND`.
      security: []
      responses:
        '200':
          description: Service available — live readiness payload.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthAvailable'
              examples:
                available:
                  $ref: '#/components/examples/HealthAvailable'
        '503':
          description: 'Kill switch active — live disabled payload (no `x-request-id` header on this response).'
          headers:
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDisabled'
              examples:
                disabled:
                  $ref: '#/components/examples/HealthDisabled'
        default:
          description: 'Unmatched method — 404 NOT_FOUND (there is no 405 in this API).'
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              examples:
                notFound:
                  $ref: '#/components/examples/RouteNotFound'

  /api/partner/v1/capabilities:
    get:
      operationId: listCapabilities
      tags: [Discovery]
      summary: List registered capabilities.
      description: |
        Capability discovery — the registered capability directory with each
        capability's supported API-version window. Authenticated (signed
        request); no tenant scoping (the directory is global). A non-GET
        method on this path falls through to 404 `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/XPATCHESTimestamp'
        - $ref: '#/components/parameters/XPATCHESNonce'
        - $ref: '#/components/parameters/XPATCHESSignature'
      responses:
        '200':
          description: Registered capabilities with version windows.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityList'
              examples:
                capabilities:
                  $ref: '#/components/examples/CapabilityList'
        '401':
          $ref: '#/components/responses/AuthFailure401'
        '409':
          $ref: '#/components/responses/NonceReplayed409'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/ApiDisabled503'
        default:
          $ref: '#/components/responses/RouteNotFound404'

  /api/partner/v1/entitlements:
    get:
      operationId: listEntitlements
      tags: [Discovery]
      summary: List entitlements for one organization (tenant-scoped).
      description: |
        Entitlement lookup for a single organization. The authenticated
        partner must own the organization (`owningPartnerId` is the tenant
        boundary) — a query for another partner's org is 403 with the org
        authorization code. A missing `orgId` query parameter is 400
        `ORG_ID_REQUIRED`.
      parameters:
        - $ref: '#/components/parameters/XPATCHESTimestamp'
        - $ref: '#/components/parameters/XPATCHESNonce'
        - $ref: '#/components/parameters/XPATCHESSignature'
        - $ref: '#/components/parameters/OrgIdQuery'
      responses:
        '200':
          description: Entitlements for the requested organization.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementList'
              examples:
                entitlements:
                  $ref: '#/components/examples/EntitlementList'
        '400':
          description: 'Missing required query parameter — `ORG_ID_REQUIRED`.'
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgIdRequiredError'
              examples:
                orgIdRequired:
                  $ref: '#/components/examples/OrgIdRequired'
        '401':
          $ref: '#/components/responses/AuthFailure401'
        '403':
          description: |
            Organization authorization failed (tenant boundary). GET-route
            policy errors carry `requestId` in the body.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgAuthorizationError'
              examples:
                orgNotBound:
                  $ref: '#/components/examples/PolicyOrgNotBoundGet'
        '409':
          $ref: '#/components/responses/NonceReplayed409'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/ApiDisabled503'
        default:
          $ref: '#/components/responses/RouteNotFound404'

  /api/partner/v1/activations:
    post:
      operationId: createActivation
      tags: [Activations]
      summary: Create an activation (idempotent).
      description: |
        Activation create. Pipeline (in enforcement order — all cumulative,
        none replaces another): organization authorization → entitlement
        (status + license window) → capability (registered + version window) →
        device/subject binding (exists, ACTIVE, same org, same capability) →
        idempotency resolution → downstream protection check (fail-closed) →
        ONE transaction (activation + receipt + idempotency record + event +
        audit).

        Idempotency (clientId + idempotencyKey):
          * FRESH → 200 receipt (`RCP-ACT-<requestId>`; activation
            `ACT-<requestId>`; event `activation.created`)
          * DUPLICATE (same request hash) → 200 duplicate receipt
            (`RCP-DUP-<requestId>`, `duplicate: true`) echoing the ORIGINAL
            activation — no second activation is created
          * CONFLICT (different request hash) → 409 `IDEMPOTENCY_KEY_CONFLICT`
            with `existingActivationId`

        The request hash is sha256 over the serialized request object, so extra
        body fields participate in idempotency identity.

        Error-body note: business-pipeline errors (403 policy, 409 idempotency
        conflict, 500 persistence, 503 downstream) carry `{ error, errorClass }`
        WITHOUT `requestId` in the body — the `x-request-id` header carries it.
        Handler-level errors (auth, rate limit, malformed/oversized body) DO
        carry `requestId`. `ACTIVATION_INPUT_MISSING` carries
        `{ error, fields }` (no `errorClass`). A defensive `INVALID_BODY`
        (`{ error, errorClass: 'INPUT', requestId }`) exists for unexpected
        body-read failures.
      parameters:
        - $ref: '#/components/parameters/XPATCHESTimestamp'
        - $ref: '#/components/parameters/XPATCHESNonce'
        - $ref: '#/components/parameters/XPATCHESSignature'
      requestBody:
        description: |
          Activation input. All four fields are required strings. Additional
          fields are permitted and participate in the request hash (a retry
          with any semantic difference is a 409 conflict, never a silent
          duplicate).
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationCreateInput'
            examples:
              valid:
                $ref: '#/components/examples/ActivationCreateInput'
      responses:
        '200':
          description: |
            Activation receipt (fresh create or duplicate collapse). The
            response body IS the receipt, signed over its exact raw bytes via
            the three `x-patches-*` receipt headers.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
            x-patches-receipt-id:
              $ref: '#/components/headers/XPatchesReceiptId'
            x-patches-content-sha256:
              $ref: '#/components/headers/XPatchesContentSha256'
            x-patches-signature:
              $ref: '#/components/headers/XPatchesSignature'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationReceipt'
              examples:
                fresh:
                  $ref: '#/components/examples/ReceiptFresh'
                duplicate:
                  $ref: '#/components/examples/ReceiptDuplicate'
        '400':
          description: |
            Unprocessable request body. Two shapes: `ACTIVATION_INPUT_MISSING`
            (`{ error, fields }` — one or more of orgId, capability, bindingId,
            idempotencyKey missing or not strings) and `MALFORMED_PAYLOAD`
            (body is not a JSON object). A defensive `INVALID_BODY`
            (`{ error, errorClass: 'INPUT', requestId }`) covers unexpected
            body-read failures.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActivationInputMissingError'
                  - $ref: '#/components/schemas/MalformedPayloadError'
              examples:
                inputMissing:
                  $ref: '#/components/examples/ActivationInputMissing'
                malformed:
                  $ref: '#/components/examples/MalformedPayload'
        '401':
          $ref: '#/components/responses/AuthFailure401'
        '403':
          description: |
            Policy pipeline denial (organization, entitlement, capability, or
            binding). POST-route business errors carry `{ error, errorClass }`
            WITHOUT `requestId` in the body.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationPolicyError'
              examples:
                entitlementMissing:
                  $ref: '#/components/examples/PolicyEntitlementMissing'
                bindingInactive:
                  $ref: '#/components/examples/PolicyBindingInactive'
        '409':
          description: |
            Two families: idempotency conflict (same key, different request
            hash — body WITHOUT `requestId`) and nonce replay (body WITH
            `requestId` and replay context).
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IdempotencyConflictError'
                  - $ref: '#/components/schemas/AuthError'
              examples:
                idempotencyConflict:
                  $ref: '#/components/examples/IdempotencyConflict'
                replayed:
                  $ref: '#/components/examples/AuthNonceReplayed'
        '413':
          description: 'Request body exceeds 262144 bytes (256 KiB) — `PAYLOAD_TOO_LARGE` with `limitBytes`.'
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeError'
              examples:
                tooLarge:
                  $ref: '#/components/examples/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '500':
          description: |
            Persistence failure — the single activation transaction failed;
            no partial state exists and the nonce is NOT registered (the same
            signed request may be retried). Body WITHOUT `requestId`.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistenceFailedError'
              examples:
                persistenceFailed:
                  $ref: '#/components/examples/PersistenceFailed'
        '503':
          description: |
            Two families: downstream protection failure (`DOWNSTREAM_UNAVAILABLE`
            — fail-closed: NOTHING is persisted, no receipt, no event) and the
            kill switch (`PARTNER_API_DISABLED`, single-key body, emitted
            before request-id assignment so it carries no `x-request-id`
            header).
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DownstreamUnavailableError'
                  - $ref: '#/components/schemas/PartnerApiDisabledError'
              examples:
                downstream:
                  $ref: '#/components/examples/DownstreamUnavailable'
                apiDisabled:
                  $ref: '#/components/examples/ApiDisabled'
        default:
          $ref: '#/components/responses/RouteNotFound404'

  /api/partner/v1/activations/{activationId}:
    get:
      operationId: getActivationStatus
      tags: [Activations]
      summary: Get the current activation status.
      description: |
        Current state of one activation. The activation must exist (else 404
        `ACTIVATION_UNKNOWN`) and belong to an organization owned by the
        authenticated partner (else 403 with the org authorization code).
        GET-route errors carry `requestId` in the body.
      parameters:
        - $ref: '#/components/parameters/XPATCHESTimestamp'
        - $ref: '#/components/parameters/XPATCHESNonce'
        - $ref: '#/components/parameters/XPATCHESSignature'
        - $ref: '#/components/parameters/ActivationIdPath'
      responses:
        '200':
          description: Current activation state.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationStatusResponse'
              examples:
                status:
                  $ref: '#/components/examples/ActivationStatus'
        '401':
          $ref: '#/components/responses/AuthFailure401'
        '403':
          description: |
            Organization authorization failed (tenant boundary). GET-route
            policy errors carry `requestId` in the body.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgAuthorizationError'
              examples:
                orgNotBound:
                  $ref: '#/components/examples/PolicyOrgNotBoundGet'
        '404':
          description: 'Unknown activation — `ACTIVATION_UNKNOWN` (GET route: body carries `requestId`).'
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationUnknownGetError'
              examples:
                unknown:
                  $ref: '#/components/examples/ActivationUnknownGet'
        '409':
          $ref: '#/components/responses/NonceReplayed409'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/ApiDisabled503'
        default:
          $ref: '#/components/responses/RouteNotFound404'

  /api/partner/v1/activations/{activationId}/deactivate:
    post:
      operationId: deactivateActivation
      tags: [Activations]
      summary: Deactivate an activation (idempotent by status).
      description: |
        Deactivate. A JSON object body is REQUIRED (an empty or non-JSON body
        is 400 `MALFORMED_PAYLOAD`) but its content is ignored — the activation
        is identified by the path parameter.

        Lifecycle: deactivating an ACTIVE activation persists `DEACTIVATED`
        (event `activation.deactivated`); a second deactivate is a no-op 200
        success receipt; deactivating a REVOKED activation is 409
        `ACTIVATION_REVOKED` (REVOKED is terminal).

        Pipeline: activation exists → organization authorization →
        entitlement (status + license window) → status transition. POST-route
        business errors carry `{ error, errorClass }` WITHOUT `requestId` in
        the body; handler-level errors (auth, malformed body, rate limit)
        carry `requestId`.
      parameters:
        - $ref: '#/components/parameters/XPATCHESTimestamp'
        - $ref: '#/components/parameters/XPATCHESNonce'
        - $ref: '#/components/parameters/XPATCHESSignature'
        - $ref: '#/components/parameters/ActivationIdPath'
      requestBody:
        description: |
          A JSON object body is required on this route but its content is
          ignored (the activation is identified by the path parameter).
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChangeInput'
            examples:
              empty:
                $ref: '#/components/examples/StateChangeInput'
      responses:
        '200':
          description: |
            Deactivation receipt (fresh transition or no-op on an already
            DEACTIVATED activation — `result` shows the persisted state).
            Signed over its exact raw bytes via the `x-patches-*` receipt
            headers.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
            x-patches-receipt-id:
              $ref: '#/components/headers/XPatchesReceiptId'
            x-patches-content-sha256:
