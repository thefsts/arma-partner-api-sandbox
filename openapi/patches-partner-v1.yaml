components:
  securitySchemes:
    PatchesSignedRequest:
      type: apiKey
      description: |
        Scoped partner authentication + request integrity. Every authenticated
        request carries four headers:

          `Authorization: PATCHES-Partner <clientId>:<keyId>`
          `X-PATCHES-Timestamp: <epoch milliseconds>`
          `X-PATCHES-Nonce: <opaque nonce, [A-Za-z0-9_-]{20,128}>`
          `X-PATCHES-Signature: <lowercase-hex HMAC-SHA256>`

        The signature is HMAC-SHA256 over the 5-field canonical string:

          `${METHOD}\n${path}\n${timestamp}\n${nonce}\n${bodyHash}`

        where `METHOD` is uppercase, `path` is the FULL request pathname
        INCLUDING the `/api/partner/v1` prefix (the query string is NOT
        signed), `timestamp` and `nonce` are the EXACT header values, and
        `bodyHash` is the lowercase-hex sha256 of the RAW request body bytes
        (a bodyless request hashes the empty string, keeping the signature
        bound to the method).

        Verification is cumulative: signature verification is the first gate
        only and never replaces — and is never replaced by — the per-operation
        tenant scoping (organization ownership), entitlement, capability, and
        device/subject binding checks. Credential states: ACTIVE and GRACE
        validate; RETIRED and REVOKED fail closed; a GRACE credential expires
        at its retirement instant.
      name: authorization
      in: header

  parameters:
    XPATCHESTimestamp:
      name: x-patches-timestamp
      in: header
      required: true
      description: 'Epoch milliseconds; must be within 300000 ms (±5 minutes) of server time. Part of the signed canonical string.'
      schema:
        type: string
        pattern: '^\d{1,16}$'
    XPATCHESNonce:
      name: x-patches-nonce
      in: header
      required: true
      description: 'Caller-generated opaque nonce; single-use within a 600000 ms (10 minutes) validity window. Part of the signed canonical string.'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{20,128}$'
    XPATCHESSignature:
      name: x-patches-signature
      in: header
      required: true
      description: 'Lowercase-hex HMAC-SHA256 over the 5-field canonical string (see the PatchesSignedRequest scheme).'
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    OrgIdQuery:
      name: orgId
      in: query
      required: true
      description: Organization id (tenant scope) — must be owned by the authenticated partner.
      schema:
        type: string
    ActivationIdPath:
      name: activationId
      in: path
      required: true
      description: 'Opaque activation id (`ACT-<requestId>`).'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'

  headers:
    XRequestId:
      description: 'Correlation id — echoes the caller''s `x-request-id` header when present, else `req-<uuid>`.'
      schema:
        type: string
      examples:
        generated:
          value: req-3f8e2a10-7c4b-4d91-9a62-5e6d8f0a1b2c
    XApiVersion:
      description: 'API version of this deployment — always `v1`.'
      schema:
        type: string
        const: v1
    CacheControlNoStore:
      description: Responses are never cached.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Seconds until the rate-limit bucket refills (minimum 1).
      schema:
        type: string
        pattern: '^\d+$'
      examples:
        oneSecond:
          value: '1'
    XPatchesReceiptId:
      description: 'Receipt id — names the SAME receipt as the body''s `receiptId` field.'
      schema:
        type: string
      examples:
        created:
          value: RCP-ACT-req-3f8e2a10-7c4b-4d91-9a62-5e6d8f0a1b2c
    XPatchesContentSha256:
      description: Lowercase-hex sha256 of the RAW response bytes.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      examples:
        digest:
          value: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
    XPatchesSignature:
      description: Lowercase-hex HMAC-SHA256 over the RAW response bytes (receipt secret).
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      examples:
        signature:
          value: b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1

  responses:
    AuthFailure401:
      description: |
        Authentication failed (401 family). Body is
        `{ error, errorClass: 'AUTHENTICATION', requestId }` plus only safe
        context keys (clientId, keyId, nonce, firstSeenAt,
        firstSeenRequestId, graceUntil, skewMs) — never secrets.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-api-version:
          $ref: '#/components/headers/XApiVersion'
        cache-control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          examples:
            missing:
              $ref: '#/components/examples/AuthMissing'
            badSignature:
              $ref: '#/components/examples/AuthSignatureInvalid'
            expiredCredential:
              $ref: '#/components/examples/AuthCredentialExpired'
            suspendedPartner:
              $ref: '#/components/examples/AuthPartnerSuspended'
    NonceReplayed409:
      description: |
        Replay protection — the nonce was already used within its 600000 ms
        validity window (409 family; carries replay context).
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-api-version:
          $ref: '#/components/headers/XApiVersion'
        cache-control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          examples:
            replayed:
              $ref: '#/components/examples/AuthNonceReplayed'
    RateLimited429:
      description: |
        Per-clientId token bucket exhausted (capacity 30, refill 10 per
        second). Rate limiting is checked AFTER authentication — only
        authenticated partners consume quota.
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-api-version:
          $ref: '#/components/headers/XApiVersion'
        cache-control:
          $ref: '#/components/headers/CacheControlNoStore'
        retry-after:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          examples:
            rateLimited:
              $ref: '#/components/examples/RateLimited'
    ApiDisabled503:
      description: |
        Kill switch — `PATCHES_PARTNER_API_DISABLED` is active. Single-key
        body, emitted before request-id assignment: no `x-request-id` header
        on this response.
      headers:
        x-api-version:
          $ref: '#/components/headers/XApiVersion'
        cache-control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerApiDisabledError'
          examples:
            apiDisabled:
              $ref: '#/components/examples/ApiDisabled'
    RouteNotFound404:
      description: 'Unmatched route or method — 404 `NOT_FOUND` (there is no 405 in this API).'
      headers:
        x-request-id:
          $ref: '#/components/headers/XRequestId'
        x-api-version:
          $ref: '#/components/headers/XApiVersion'
        cache-control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
          examples:
            notFound:
              $ref: '#/components/examples/RouteNotFound'

  schemas:
    HealthAvailable:
      type: object
      description: Live readiness payload (computed fresh; never cached).
      required: [service, version, status, directDatabaseAccess, requiresScopedAuthentication, capabilities, supportedApiVersions, at]
      properties:
        service:
          type: string
          const: PATCHES Partner API
        version:
          type: string
          const: v1
        status:
          type: string
          const: available
        directDatabaseAccess:
          type: boolean
          const: false
          description: The partner API never exposes direct database access.
        requiresScopedAuthentication:
          type: boolean
          const: true
        capabilities:
          type: array
          items:
            type: string
          description: Registered capability identifiers (live from the directory).
        supportedApiVersions:
          type: array
          items:
            type: string
        at:
          type: integer
          description: Epoch milliseconds (server clock).
    HealthDisabled:
      type: object
      description: 'Kill-switch live disabled payload — computed fresh; omits capabilities/supportedApiVersions.'
      required: [service, version, status, directDatabaseAccess, requiresScopedAuthentication, at]
      properties:
        service:
          type: string
          const: PATCHES Partner API
        version:
          type: string
          const: v1
        status:
          type: string
          const: disabled
        directDatabaseAccess:
          type: boolean
          const: false
        requiresScopedAuthentication:
          type: boolean
          const: true
        at:
          type: integer
          description: Epoch milliseconds (server clock).
    CapabilityView:
      type: object
      required: [capability, minApiVersion, maxApiVersion, description]
      properties:
        capability:
          type: string
          description: Generic contract identifier (e.g. traffic_stop_privacy).
        minApiVersion:
          type: string
        maxApiVersion:
          type: string
        description:
          type: string
    CapabilityList:
      type: object
      required: [requestId, capabilities]
      properties:
        requestId:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityView'
    EntitlementView:
      type: object
      required: [entitlementId, capability, status, licensedFrom, licensedUntil]
      properties:
        entitlementId:
          type: string
        capability:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, REVOKED]
        licensedFrom:
          type: integer
          description: Epoch milliseconds — license window start.
        licensedUntil:
          type: integer
          description: Epoch milliseconds — license window end.
    EntitlementList:
      type: object
      required: [requestId, orgId, entitlements]
      properties:
        requestId:
          type: string
        orgId:
          type: string
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementView'
    ActivationView:
      type: object
      description: Current activation state (also the `result` embedded in receipts).
      required: [activationId, orgId, capability, bindingId, status, activatedAt, deactivatedAt, revokedAt]
      properties:
        activationId:
          type: string
        orgId:
          type: string
        capability:
          type: string
        bindingId:
          type: string
        status:
          type: string
          enum: [ACTIVE, DEACTIVATED, REVOKED]
        activatedAt:
          type: integer
          description: Epoch milliseconds.
        deactivatedAt:
          type: [integer, 'null']
          description: Epoch milliseconds, or null while active.
        revokedAt:
          type: [integer, 'null']
          description: Epoch milliseconds, or null until revoked.
    ActivationStatusResponse:
      type: object
      required: [requestId, activation]
      properties:
        requestId:
          type: string
        activation:
          $ref: '#/components/schemas/ActivationView'
    ActivationCreateInput:
      type: object
      description: |
        Activation create input. All four fields are required strings.
        Additional fields are permitted and participate in the request hash
        (idempotency identity).
      required: [orgId, capability, bindingId, idempotencyKey]
      additionalProperties: true
      properties:
        orgId:
          type: string
          description: Owning organization id (tenant scope).
        capability:
          type: string
          description: Registered capability identifier.
        bindingId:
          type: string
          description: Opaque device/subject binding id.
        idempotencyKey:
          type: string
          description: Caller-chosen idempotency identity (unique per clientId).
    StateChangeInput:
      type: object
      description: |
        Deactivate/revoke request body. A JSON object body is required (an
        empty or non-JSON body is rejected), but its content is ignored — the
        activation is identified by the path parameter.
      additionalProperties: true
    ActivationReceipt:
      type: object
      description: |
        200 receipt for `POST /activations` — fresh create or duplicate
        collapse. The response body IS the receipt, signed over its exact raw
        bytes via the three `x-patches-*` receipt headers.
      required: [schemaVersion, receiptId, requestId, clientId, operation, outcome, at, activationId, orgId, capability, payloadHash, result]
      properties:
        schemaVersion:
          type: string
          const: patches-partner-v1
        receiptId:
          type: string
          description: '`RCP-ACT-<requestId>` (fresh) or `RCP-DUP-<requestId>` (duplicate).'
        requestId:
          type: string
        clientId:
          type: string
        operation:
          type: string
          const: activation.create
        outcome:
          type: string
          const: SUCCESS
        at:
          type: integer
          description: Epoch milliseconds.
        activationId:
          type: string
          description: '`ACT-<requestId>`; on duplicates, the ORIGINAL activation.'
        orgId:
          type: string
        capability:
          type: string
        payloadHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: sha256 of the serialized request object (idempotency identity).
        result:
          $ref: '#/components/schemas/ActivationView'
        duplicate:
          type: boolean
          const: true
          description: Present only on duplicate-collapse receipts.
    StateChangeReceipt:
      type: object
      description: |
        200 receipt for deactivate/revoke — fresh transition or idempotent
        no-op. The response body IS the receipt, signed over its exact raw
        bytes via the three `x-patches-*` receipt headers.
      required: [schemaVersion, receiptId, requestId, clientId, operation, outcome, at, activationId, orgId, capability, result]
      properties:
        schemaVersion:
          type: string
          const: patches-partner-v1
        receiptId:
          type: string
          description: '`RCP-DEACTIVATE-<requestId>` or `RCP-REVOKE-<requestId>`.'
        requestId:
          type: string
        clientId:
          type: string
        operation:
          type: string
          enum: [activation.deactivate, activation.revoke]
        outcome:
          type: string
          const: SUCCESS
        at:
          type: integer
          description: Epoch milliseconds.
        activationId:
          type: string
        orgId:
          type: string
        capability:
          type: string
        result:
          $ref: '#/components/schemas/ActivationView'
    EventView:
      type: object
      required: [eventId, capability, activationId, type, at]
      properties:
        eventId:
          type: string
          description: '`EVT-<requestId>`.'
        capability:
          type: string
        activationId:
          type: string
        type:
          type: string
          enum: [activation.created, activation.deactivated, activation.revoked]
        at:
          type: integer
          description: Epoch milliseconds.
    EventList:
      type: object
      required: [requestId, orgId, events]
      properties:
        requestId:
          type: string
        orgId:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventView'
    AuditView:
      type: object
      description: Scrubbed audit row — only allowlisted view fields; no detail payloads.
      required: [sequence, at, actorKind, clientId, requestId, operation, outcome]
      properties:
        sequence:
          type: integer
          description: Strictly increasing append-only ordering.
        at:
          type: integer
          description: Epoch milliseconds.
        actorKind:
          type: string
          enum: [PARTNER, SYSTEM]
        clientId:
          type: string
        requestId:
          type: string
        operation:
          type: string
          enum: [activation.create, activation.status, activation.deactivate, activation.revoke, capabilities.list, entitlements.list, events.list, audit.list]
        outcome:
          type: string
          enum: [SUCCESS, REJECTED, FAILED, QUARANTINED, CONFLICT]
    AuditList:
      type: object
      required: [requestId, orgId, audit]
      properties:
        requestId:
          type: string
        orgId:
          type: string
        audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditView'
    AuthError:
      type: object
      description: |
        Authentication failure (401 or 409). Only safe context keys are
        surfaced — never secrets.
      required: [error, errorClass, requestId]
      properties:
        error:
          type: string
          enum: [AUTH_MISSING, AUTH_MALFORMED, PARTNER_UNKNOWN, PARTNER_SUSPENDED, CREDENTIAL_UNKNOWN, CREDENTIAL_REVOKED, CREDENTIAL_EXPIRED, TIMESTAMP_OUT_OF_WINDOW, NONCE_INVALID, NONCE_REPLAYED, SIGNATURE_INVALID, SECRET_UNAVAILABLE]
        errorClass:
          type: string
          const: AUTHENTICATION
        clientId:
          type: string
          description: Present on PARTNER_SUSPENDED.
        keyId:
          type: string
          description: Present on credential-family failures.
        nonce:
          type: string
          description: Present on NONCE_REPLAYED.
        firstSeenAt:
          type: integer
          description: Epoch milliseconds — present on NONCE_REPLAYED.
        firstSeenRequestId:
          type: string
          description: Present on NONCE_REPLAYED.
        graceUntil:
          type: integer
          description: Epoch milliseconds — retirement instant of a GRACE credential.
        skewMs:
          type: integer
          description: Absolute clock skew — present on TIMESTAMP_OUT_OF_WINDOW.
        requestId:
          type: string
    OrgIdRequiredError:
      type: object
      required: [error, errorClass, requestId]
      properties:
        error:
          type: string
          const: ORG_ID_REQUIRED
        errorClass:
          type: string
          const: INPUT
        requestId:
          type: string
    MalformedPayloadError:
      type: object
      required: [error, errorClass, requestId]
      properties:
        error:
          type: string
          const: MALFORMED_PAYLOAD
        errorClass:
          type: string
          const: INPUT
        requestId:
          type: string
    ActivationInputMissingError:
      type: object
      description: 'Missing/non-string activation fields — carries `{ error, fields }` (no `errorClass`).'
      required: [error, fields]
      properties:
        error:
          type: string
          const: ACTIVATION_INPUT_MISSING
        fields:
          type: array
          items:
            type: string
            enum: [orgId, capability, bindingId, idempotencyKey]
          description: The missing (or non-string) fields.
    PayloadTooLargeError:
      type: object
      required: [error, errorClass, limitBytes, requestId]
      properties:
        error:
          type: string
          const: PAYLOAD_TOO_LARGE
        errorClass:
          type: string
          const: INPUT
        limitBytes:
          type: integer
          const: 262144
        requestId:
          type: string
    OrgAuthorizationError:
      type: object
      description: |
        Organization authorization failure on a GET route (tenant boundary) —
        carries `requestId` in the body.
      required: [error, errorClass, requestId]
      properties:
        error:
          type: string
          enum: [ORG_UNKNOWN, ORG_SUSPENDED, ORG_NOT_BOUND_TO_PARTNER]
        errorClass:
          type: string
          const: AUTHORIZATION
        requestId:
          type: string
    ActivationPolicyError:
      type: object
      description: |
        Policy pipeline denial on `POST /activations` (organization,
        entitlement, capability, or binding) — body WITHOUT `requestId` (the
        `x-request-id` header carries it).
      required: [error, errorClass]
      properties:
        error:
          type: string
          enum: [ORG_UNKNOWN, ORG_SUSPENDED, ORG_NOT_BOUND_TO_PARTNER, ENTITLEMENT_MISSING, ENTITLEMENT_INACTIVE, ENTITLEMENT_REVOKED, ENTITLEMENT_EXPIRED, CAPABILITY_UNKNOWN, CAPABILITY_VERSION_UNSUPPORTED, BINDING_UNKNOWN, BINDING_INACTIVE, BINDING_ORG_MISMATCH, BINDING_CAPABILITY_MISMATCH]
        errorClass:
          type: string
          const: AUTHORIZATION
    StateChangePolicyError:
      type: object
      description: |
        Policy denial on deactivate/revoke (organization authorization or
        entitlement lapse on the activation's org/capability — the capability
        and binding checks are create-time only) — body WITHOUT `requestId`.
      required: [error, errorClass]
      properties:
        error:
          type: string
          enum: [ORG_UNKNOWN, ORG_SUSPENDED, ORG_NOT_BOUND_TO_PARTNER, ENTITLEMENT_MISSING, ENTITLEMENT_INACTIVE, ENTITLEMENT_REVOKED, ENTITLEMENT_EXPIRED]
        errorClass:
          type: string
          const: AUTHORIZATION
    IdempotencyConflictError:
      type: object
      description: 'Same idempotency key, different request hash — body WITHOUT `requestId`.'
      required: [error, errorClass, existingActivationId]
      properties:
        error:
          type: string
          const: IDEMPOTENCY_KEY_CONFLICT
        errorClass:
          type: string
          const: IDEMPOTENCY
        existingActivationId:
          type: [string, 'null']
          description: The activation created by the original request, or null.
    ActivationRevokedError:
      type: object
      description: 'Deactivating a REVOKED activation (terminal state) — body WITHOUT `requestId`.'
      required: [error, errorClass]
      properties:
        error:
          type: string
          const: ACTIVATION_REVOKED
        errorClass:
          type: string
          const: STATE
    ActivationUnknownGetError:
      type: object
      description: Unknown activation on the GET status route — carries `requestId` in the body.
      required: [error, errorClass, requestId]
      properties:
        error:
          type: string
          const: ACTIVATION_UNKNOWN
        errorClass:
          type: string
          const: NOT_FOUND
        requestId:
          type: string
    ActivationUnknownPostError:
      type: object
      description: 'Unknown activation on POST routes — body WITHOUT `requestId` (the `x-request-id` header carries it).'
      required: [error, errorClass]
      properties:
        error:
          type: string
          const: ACTIVATION_UNKNOWN
        errorClass:
          type: string
          const: NOT_FOUND
    RateLimitError:
      type: object
      required: [error, errorClass, retryAfterMs, requestId]
      properties:
        error:
          type: string
          const: RATE_LIMITED
        errorClass:
          type: string
          const: RATE_LIMIT
        retryAfterMs:
          type: integer
          description: Milliseconds until the bucket refills (the `retry-after` header carries the same value in seconds, minimum 1).
        requestId:
          type: string
    DownstreamUnavailableError:
      type: object
      description: 'Downstream protection failure — fail-closed (nothing persisted) — body WITHOUT `requestId`.'
      required: [error, errorClass]
      properties:
        error:
          type: string
          const: DOWNSTREAM_UNAVAILABLE
        errorClass:
          type: string
          const: DOWNSTREAM
    PersistenceFailedError:
      type: object
      description: |
        Persistence failure — the single transaction failed; no partial state
        and the nonce is NOT registered — body WITHOUT `requestId`.
      required: [error, errorClass]
      properties:
        error:
          type: string
          const: PARTNER_PERSISTENCE_FAILED
        errorClass:
          type: string
          const: PERSISTENCE
    PartnerApiDisabledError:
      type: object
      description: 'Kill switch — single-key body, no `x-request-id` header on this response.'
      required: [error]
      properties:
        error:
          type: string
          const: PARTNER_API_DISABLED
    NotFoundError:
      type: object
      description: 'Unmatched route or method (there is no 405 in this API).'
      required: [error, requestId]
      properties:
        error:
          type: string
          const: NOT_FOUND
        requestId:
          type: string

