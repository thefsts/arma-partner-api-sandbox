            x-api-version:
              $ref: '#/components/headers/XApiVersion'
            cache-control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MalformedPayloadError'
              examples:
                malformed:
                  $ref: '#/components/examples/MalformedPayload'
        '401':
          $ref: '#/components/responses/AuthFailure401'
        '403':
          description: |
            Policy denial (organization authorization or entitlement lapse on
            the activation's org/capability). POST-route business errors carry
            `{ error, errorClass }` WITHOUT `requestId` in the body.
          headers:
            x-request-id:
